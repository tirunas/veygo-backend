version: '3.9'

services:
  api:
    build: .
    ports:
      - '3001:3001'
    env_file: .env.development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veygo
      POSTGRES_PASSWORD: veygo_dev
      POSTGRES_DB: veygo
    ports:
      - '5534:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veygo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6480:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  directus:
    image: directus/directus:11
    ports:
      - '8155:8055'
    environment:
      SECRET: 'veygo-directus-secret-dev'
      DB_CLIENT: 'pg'
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: veygo
      DB_USER: veygo
      DB_PASSWORD: veygo_dev
      ADMIN_EMAIL: admin@veygo.dev
      ADMIN_PASSWORD: veygo_admin_dev
      PUBLIC_URL: 'http://localhost:8155'
      WEBSOCKETS_ENABLED: 'false'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'true'
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_SAME_SITE: 'lax'
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: '4096'
      ASSETS_ALLOW_TRANSFORMATIONS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - directus_uploads:/directus/uploads
      - ./directus-extensions:/directus/extensions

volumes:
  postgres_data:
  redis_data:
  directus_uploads:
